[project]
name = "dice-mcp"
version = "1.1.0"
description = "Connect DICE to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No DICE API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["dice", "dice api", "dice mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/dice-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=dice"
Source = "https://github.com/cotlet-connect/dice-mcp"

[project.scripts]
dice-mcp = "dice_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"dice_agent.py" = "dice_agent.py"

[tool.hatch.build.targets.sdist]
include = ["dice_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
